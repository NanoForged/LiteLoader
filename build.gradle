import groovy.json.JsonOutput

plugins {
    id 'java'
    id 'application'
    // Apply false — we conditionally apply below based on useShadowJar
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

// ==== ctrl ====

// assets/ mirrors the mod root: a file placed there lands next to mod_info.json, so
// that is where loose mod files (e.g. the bootstrap agent scripts) belong.
// enable to copy only assets/data, assets/graphics and assets/sounds into the target
boolean isAssetsCopyStrictMode = false

// is using shadow?
boolean usingShadow = false

// auto put `included` depends jar to modDir/libs/*
boolean bringYouOwnJars = true

// using LR to custom game launch args
boolean usingBootstrapAgent = true




// === LR configs ===

def bootstrapJarName = 'LaunchRedirector.jar'
def bootstrapBaseName = bootstrapJarName.replaceFirst(/\.jar$/, '')
def bootstrapVersion = libs.versions.launchredirector.get()


// ==== meta builder ====
def mod_Meta = [
        id             : mod_id,
        name           : mod_name,
        author         : mod_author,
        version        : mod_version,
        description    : mod_description,
        gameVersion    : starsector_version,
        totalConversion: false,
        jars           : ["jars/${mod_id}.jar"],
        dependencies   : [],
        modPlugin      : mod_main_class,
]



def gameInstallPath = starsector_path
def gameCorePath = "$gameInstallPath/starsector-core"
def apiJarPath = "$gameCorePath/starfarer.api.jar"
def gameModsPath = "$gameInstallPath/mods"

def gameJars = fileTree(gameCorePath){ include '*.jar' }
def apiJar = files(apiJarPath)

configurations {
    create('included')
   if (usingBootstrapAgent) create('bootstrap')
}

dependencies {
    implementation(apiJar)
    runtimeOnly(gameJars)
    if (usingBootstrapAgent) {

        implementation("com.github.NanoForged:LaunchRedirector:${bootstrapVersion}")
        bootstrap("com.github.NanoForged:LaunchRedirector:${bootstrapVersion}:all") {
            transitive = false
        }
    }

    included compileOnly(project(":LiteLoader"))

    annotationProcessor(compileOnly('com.google.auto.service:auto-service:1.1.1'))



}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ───── Remove test source set — Starsector mods don't need tests ─────
sourceSets {
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}



allprojects {

    repositories {
        maven {url = 'https://maven.aliyun.com/repository/public/' }
        maven { url = 'https://maven.aliyun.com/repository/central' }

        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }

        maven {
            url = "https://jitpack.io"
        }

        maven {
            url = uri("https://nexus.gtnewhorizons.com/repository/releases/")
        }
        mavenCentral()
    }
}



if (usingShadow) {
    apply plugin: 'com.gradleup.shadow'

    shadowJar {
        archiveClassifier.set('')
        archiveVersion.set('')

        // Only relocate if you expect dependency conflicts with other mods.
        // For most Starsector mods this isn't needed.
        // relocate 'com.example.lib', 'your.mod.shaded.lib'

        // Minimise: strip unused classes from shaded jars — saves size.
        minimize()
    }
} else {
    // Regular jar still needs to be built
    jar {
        archiveClassifier.set('')
        archiveVersion.set('')
    }
}





tasks.register('generateModInfo') {
    group = 'StarsectorModDev'

    def outputDir = layout.buildDirectory.dir('generated/modInfo')
    outputs.dir(outputDir)

    doLast {
        def outFile = outputDir.get().file('mod_info.json').asFile
        outFile.parentFile.mkdirs()
        outFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(mod_Meta))
    }
}



def modJarProvider = usingShadow ? tasks.named('shadowJar') : tasks.named('jar')

def stagingDir = layout.buildDirectory.dir("staging/${mod_id}")

// The jar is renamed to a stable name, so the ref it was resolved from is recorded next to
// it instead - that is the only place the version survives once the name is normalized.
def bootstrapVersionDir = layout.buildDirectory.dir('generated/bootstrap')

tasks.register('generateBootstrapAndVersion') {
    group = 'StarsectorModDev'
    onlyIf { usingBootstrapAgent }

    def version = bootstrapVersion
    def outputDir = bootstrapVersionDir
    def versionFileName = bootstrapBaseName + '.version'

    inputs.property('launchRedirectorVersion', version)
    outputs.dir(outputDir)

    doLast {
        def out = outputDir.get().file(versionFileName).asFile
        out.parentFile.mkdirs()
        out.text = version + System.lineSeparator()
    }
}

tasks.register('stageMod', Sync) {
    group = 'StarsectorModDev'

    // the name the bootstrap jar is staged under is decided by a rename action, which the
    // up-to-date check does not fingerprint on its own; declaring it keeps the layout from
    // silently going stale when the name changes
    inputs.property('bootstrapJarName', bootstrapJarName)

    dependsOn modJarProvider
    dependsOn tasks.named('generateModInfo')
    if (usingBootstrapAgent){
        dependsOn tasks.named('generateBootstrapAndVersion')
    }

    from(modJarProvider.map { it.outputs.files }) {
        rename { "${mod_id}.jar" }
        into 'jars'
    }

    from(layout.buildDirectory.dir('generated/modInfo')) {
        include 'mod_info.json'
    }

    if (bringYouOwnJars) {
        from(configurations.included) {
            into 'libs'
        }
    }

    if (usingBootstrapAgent){
        from(configurations.bootstrap) {
            into 'bootstrap'
            // drop the resolved ref from the name; anything else is staged as-is
            rename { String name -> name.startsWith(bootstrapBaseName) ? bootstrapJarName : name }
        }
        from(bootstrapVersionDir) {
            into 'bootstrap'
        }
    }

    if (isAssetsCopyStrictMode){
        from("$projectDir/assets/data")  { into 'data'  }
        from("$projectDir/assets/graphics") { into 'graphics' }
        from("$projectDir/assets/sounds") { into 'sounds'  }
    } else {
        from("$projectDir/assets") {
            if (!usingBootstrapAgent){
                exclude("bootstrap-agent.ps1")
            }
        }
    }


    into stagingDir
}

tasks.register('toGame', Sync) {
    group = 'StarsectorModDev'

    dependsOn tasks.named('stageMod')

    from stagingDir
    into "${gameModsPath}/${mod_id}"
}

tasks.register('deployMod') {
    group = 'StarsectorModDev'

    dependsOn clean
    dependsOn tasks.named('toGame')
}

tasks.register('releaseZip', Zip) {
    group = 'StarsectorModDev'

    dependsOn tasks.named('stageMod')

    archiveFileName = "${mod_name}-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from stagingDir
}


tasks.named('run') {
    group = 'StarsectorModDev'
    dependsOn tasks.named('deployMod')

    workingDir = file(gameCorePath)
}


application {
    def args = layout.projectDirectory.file("args.txt").toString()

    List<String> appArgs = ['-noverify',"@${args}","-Djava.library.path=${gameCorePath}/native/windows","-Dcom.fs.starfarer.settings.paths.saves=${gameInstallPath}/saves","-Dcom.fs.starfarer.settings.paths.screenshots=${gameInstallPath}/screenshots","-Dcom.fs.starfarer.settings.paths.logs=${gameInstallPath}","-Dcom.fs.starfarer.settings.paths.mods=${gameInstallPath}/mods"]

    if (usingBootstrapAgent) {
        def agentJar = configurations.bootstrap.singleFile
        appArgs.add("-javaagent:${agentJar.absolutePath}")
    }

    applicationDefaultJvmArgs = appArgs
    mainClass = 'com.fs.starfarer.StarfarerLauncher'

}

